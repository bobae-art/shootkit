# main 브랜치를 고치면 자동으로 빌드해서 gh-pages 브랜치에 올린다.
# GitHub Pages가 gh-pages 브랜치를 https://bobae-art.github.io/shootkit/ 로 보여 준다.
name: 빌드 · 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NUXT_APP_BASE_URL: /shootkit/
      - name: gh-pages 브랜치에 올리기
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .output/public
          publish_branch: gh-pages
          commit_message: "Deploy ${{ github.sha }}"
